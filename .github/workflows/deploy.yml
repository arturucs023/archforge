name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos: contents para leer el repo, pages para publicar
permissions:
  contents: read
  pages: write
  id-token: write

# Despliega automaticamente al hacer push a main
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recursos del laboratorio VM en el navegador (v86 + ISO de Alpine).
      # No viven en git: se descargan aqui para que el repo no engorde.
      - name: Setup browser VM assets
        run: npm run setup:vm-web

      # ISO personalizada: inyecta nano, vim, git... DENTRO de la imagen para
      # que la VM los instale desde el CD sin red. Si falla, se sigue con la
      # ISO base (el propio script hace fallback, nunca rompe el deploy).
      - name: Build custom Alpine ISO
        run: bash tools/build-custom-iso.sh

      - name: Build
        run: npm run build

      # GitHub Pages usa Jekyll por defecto e ignora carpetas con _
      # .nojekyll desactiva ese procesado y publica el dist tal cual
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4